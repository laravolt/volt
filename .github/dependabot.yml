# Weekly checks; a release must be at least 14 days old before Dependabot proposes it.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major the image runs (node:24). Raise it together with the image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Stay on a Node LTS line; move to the next LTS major by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
